<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Sensor Streamer</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #status { font-size: 14px; margin-bottom: 12px; white-space: pre-line; }
  button {
    font-size: 18px;
    padding: 14px 20px;
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #2d7cf6;
    color: white;
    margin-bottom: 12px;
  }
  button:disabled { background: #444; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; }
  .label { color: #999; }
  .ok { color: #4caf50; }
  .bad { color: #f44336; }
</style>
</head>
<body>
  <h1>Motion Boss - Phone Sensor Streamer</h1>
  <div id="status">연결 전</div>
  <button id="connectBtn">연결 + 센서 권한 요청</button>

  <div class="row"><span class="label">WS</span><span id="wsState">-</span></div>
  <div class="row"><span class="label">동기화 offset</span><span id="offsetVal">-</span></div>
  <div class="row"><span class="label">전송 Hz</span><span id="hzVal">-</span></div>
  <div class="row"><span class="label">accel</span><span id="accVal">-</span></div>
  <div class="row"><span class="label">gyro</span><span id="gyroVal">-</span></div>

  <script src="app.js"></script>
</body>
</html>
